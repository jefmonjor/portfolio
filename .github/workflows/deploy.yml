name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/jefmonjor/portfolio:latest
            ghcr.io/jefmonjor/portfolio:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    needs: build
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
    steps:
      # Skip gracefully until the SSH secrets are configured in the repo.
      - name: Check deploy configuration
        id: config
        run: |
          if [ -z "$SSH_HOST" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SSH_HOST secret not set — image was pushed to GHCR, deploy skipped."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        if: steps.config.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            # Login only needed while the ghcr.io package is private.
            if [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
              echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u jefmonjor --password-stdin
            fi
            docker pull ghcr.io/jefmonjor/portfolio:latest
            docker stop portfolio 2>/dev/null || true
            docker rm portfolio 2>/dev/null || true
            docker run -d \
              --name portfolio \
              --restart unless-stopped \
              -p 127.0.0.1:3000:3000 \
              ghcr.io/jefmonjor/portfolio:latest
            docker image prune -f
